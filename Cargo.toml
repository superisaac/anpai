[workspace]
resolver = "2"
members = [
        "crates/feel",
        "crates/dmn",
        "crates/anpai",
        "crates/anpaiutils",
]

[workspace.dependencies]
chrono = {version="0.4.45"}
iso8601 = {version="0.6.5", features = ["chrono"]}
lazy_static = "1.5.0"
regex = "1.13.1"
feel = { path="crates/feel" }
dmn = { path="crates/dmn" }
anpaiutils = { path="crates/anpaiutils" }
clap = { version="4.6.6", features = ["derive"]}
serde = {version = "1.0.229", features = ["derive"] }
sxd-document = "0.3.2"
sxd-xpath = "0.4.2"
serde_json = "1.0.151"
